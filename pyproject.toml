[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-station-backend"
version = "1.0.0"
description = "Sentinel Station backend — Local agent-first control plane for AI/ML skills"
readme = "../README.md"
license = {text = "MIT"}
authors = [{name = "Alan Vo", email = "alanvo@gmail.com"}]
maintainers = [{name = "Alan Vo", email = "alanvo@gmail.com"}]
keywords = ["ai", "ml", "agents", "skills", "catalog", "validation", "planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.6.0",
    "python-dotenv==1.0.1",
    "httpx==0.28.0",
    "aiosqlite==0.20.0",
    "sqlalchemy==2.0.35",
    "alembic==1.14.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.27.0",
    "ruff==0.7.0",
    "mypy==1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true